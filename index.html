function queue() { try { return JSON.parse(store('skx_queue') || '[]'); } catch (e) { return []; } }

var SKA_FLUSHING = false;

// PIC question (a visit is when the sales learns the number), unless another screen is open.
function flushQueue() {
  var q = queue().filter(function (x) { return !x.who || x.who === SKA.name; });
  if (!q.length || SKA_FLUSHING || !SKA.token) return;
  SKA_FLUSHING = true;
  var item = q[0];
  call('skxSave', SKA.token, item.a, item.photo || '').then(function () {
    var rest = queue().filter(function (x) { return x.a.cid !== item.a.cid; }); setQueue(rest);
    SKA_FLUSHING = false;
    var mine = rest.filter(function (x) { return !x.who || x.who === SKA.name; });
    if (mine.length) { flushQueue(); return; }
    var s0 = school(item.a.key);
    if (s0 && !phoneOk(s0.picPhone) && (SKA.view === 'home' || SKA_CATS[SKA.view]) && $('sheet').classList.contains('hide')) contactSheet(s0.key, 'queued');
    else toast('Catatan tertunda sudah terkirim.');
    loadHome(false);
  }).catch(function (e) {
    SKA_FLUSHING = false;
    // Not permanent: keep it. The next app start, return to the app, minute or signal sends it
    // again (the server ignores repeats).
    if (!isPermanentErr(e)) return;
    var rest = queue().filter(function (x) { return x.a.cid !== item.a.cid; }); setQueue(rest);
    if (/bukan pegangan/i.test(String(e.message))) {
      var rj = rejected();
      rj.push({ school: item.school || '', at: item.a.at || '', jenis: item.a.jenis || '', hasil: item.a.hasil || '', who: item.who || SKA.name });

// Reminder text from Pengaturan "Pesan WA tagihan": {waktu} {pic} {sales} {invoice} {tanggal} {jumlah} ({sekolah} too).
function waTagihText(x) {
  var d = SKA.data, tpl = d.settings.waTagih || '', pic = x.picName || '';
  if (/^(bu|ibu|pak|bapak|bpk|bp)\.?\s/i.test(pic)) tpl = tpl.replace(/Bapak\/Ibu\s+\{pic\}/g, '{pic}');
  return fill(tpl, { waktu: waktu(), pic: pic, sales: d.me.name, sekolah: x.school || '', invoice: x.inv || '', tanggal: tglPanjang(x.date), jumlah: rpPenuh(x.amount) })
    .replace(/Bapak\/Ibu\s+,/g, 'Bapak/Ibu,').replace(/ {2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}
function waTagihHref(x) { var p = phoneOk(x.picPhone); return 'https://wa.me/' + (p ? '62' + p.slice(1) : '') + '?text=' + encodeURIComponent(waTagihText(x)); }
// Overdue invoices of one school (button Tagih of a recommendation).
function tagihSheet(key) {
  var d = SKA.data, s = school(key) || { key: key, name: '' }, days = d.settings.overdueDays || 25;
  var list = (d.tagihan || []).filter(function (x) { return x.key === key; });
  if (!list.length) list = (s.invoices || []).filter(function (i) { return i.age > days; }).map(function (i) {
    return { key: s.key, school: s.name, sales: s.sales, inv: i.inv, date: i.date, age: i.age, amount: i.amount, picName: s.pic, picPhone: s.picPhone };
  });
  openSheet('<h2>Tagihan ' + esc(s.name) + '</h2><p class="muted small" style="margin-top:-4px">Invoice belum lunas lebih dari ' + days + ' hari.</p>' +
    (list.length ? list.map(function (x) { return tagihItem(d, x, true); }).join('') : '<p class="muted">Tidak ada invoice lewat ' + days + ' hari.</p>') +
    '<button class="btn block" style="margin-top:14px" onclick="closeSheet()">Tutup</button>');
}

// Order (the bottom bar's Riwayat is the activity list): this year to date next to the same days
// last year, order per month (bar = this year, thin yellow line = the same month last year, with
// last year's amounts in a line below), activities per month and totals per year.
// hs: the totals to show, by default the viewer's own (d.history); the Manajer's Tim rows pass one
// person's. The monthly target bar belongs to the viewer's own numbers only.
function historyBody(d, hs) {
  var own = !hs || hs === d.history, t = d.totals, Y = +d.today.slice(0, 4), mo = +d.today.slice(5, 7) - 1, h = '';
  hs = hs || d.history;
  h += '<dl class="kv" style="margin-top:12px"><dt>Order ' + Y + ' sampai hari ini</dt><dd>' + rp(hs.ytd) + '</dd>' +
    '<dt>Order ' + (Y - 1) + ' periode yang sama</dt><dd>' + rp(hs.ytdPrev) + '</dd></dl>';
  if (own && t.target > 0) {
    var pct = Math.min(100, Math.round(t.omzetMonth / t.target * 100));
    h += '<div class="lbl">Target bulan ini ' + rp(t.target) + ': ' + pct + '%</div><div class="mtrack"><i class="b" style="width:' + pct + '%"></i></div>';
  }
  var months = hs.months || [], prev = hs.monthsPrev || [], max = 1, last = [], i;
  for (i = 0; i < 12; i++) { max = Math.max(max, months[i] || 0, prev[i] || 0); if (prev[i] > 0) last.push(SKA_BULAN[i] + ' ' + rp(prev[i])); }
  h += '<div class="lbl">Order per bulan</div><div class="mchart">';
  for (i = 0; i < 12; i++) h += barRow(SKA_BULAN[i], months[i] || 0, prev[i] || 0, max, i === mo ? ' now' : i > mo ? ' later' : '');
  h += '</div><div class="legend"><span><i class="key b"></i>' + Y + '</span><span><i class="key p"></i>bulan yang sama ' + (Y - 1) + '</span></div>';
  if (last.length) h += '<div class="small" style="margin-top:8px">Order ' + (Y - 1) + ' per bulan: ' + esc(nbRp(last.join(', '))) + '.</div>';
  // Activities from the first month that has one (the months before the app have none).
  var v = hs.visitsByMonth || [], st = 0;
  while (st < mo && !(v[st] > 0)) st++;
  h += '<div class="lbl">Kegiatan per bulan ' + Y + '</div><div class="vgrid">';
  for (i = st; i <= mo; i++) h += '<div>' + SKA_BULAN[i] + '<b>' + (v[i] || 0) + '</b></div>';
  h += '</div>' + yearBars(hs.byYear, String(Y));
  return h + '<p class="muted small" style="margin-top:10px">Dari order yang dicatat admin.</p>';
}
function barRow(label, v, p, max, cls) {
  return '<div class="mrow' + (cls || '') + '"><span class="ml">' + esc(label) + '</span><span class="mtrack"><i class="b" style="width:' + Math.round(v / max * 100) + '%"></i>' +
    (p > 0 ? '<i class="p" style="left:' + Math.round(p / max * 100) + '%"></i>' : '') + '</span><span class="mv">' + (v ? rp(v) : '-') + '</span></div>';
}
function yearBars(byYear, Y) {
  var years = Object.keys(byYear || {}).sort(), max = 1;
  years.forEach(function (y) { max = Math.max(max, byYear[y] || 0); });
  return years.length ? '<div class="lbl">Order per tahun</div><div class="mchart">' + years.map(function (y) { return barRow(y, byYear[y] || 0, 0, max, y === Y ? ' now' : ''); }).join('') + '</div>' : '';
}

// Detail tim (Manajer only): one row per sales, then Kantor and other holders. A row: money,
// activities of the last 7 days, follow-ups, how many new targets (schools that are no client yet)
// were started, overdue invoices; buttons for the schools and for that person's order history.
function teamRows(d) {
  var rows = (d.team || []).filter(function (r) { return r.sales || r.schools > 0; }), Y = d.today.slice(0, 4);
  if (!rows.length) return '<p class="muted" style="margin-top:16px">Belum ada sales.</p>';
  return rows.map(function (r) {
    return '<div class="item team"><span class="nm"><span class="av" data-i="' + esc(r.name.charAt(0).toUpperCase()) + '"></span>' + esc(r.name) + '<em>' + (r.schools - r.newTargets) + ' klien, ' + r.newTargets + ' target baru</em></span><span class="tgrid">' +
        '<span><i class="ti">' + SKA_ICON.wallet + '</i><b>' + rp(r.history ? r.history.ytd : r.omzetYear) + '</b>order ' + Y + ' s.d. hari ini</span><span><i class="ti">' + SKA_ICON.chart + '</i><b>' + rp(r.omzet12) + '</b>12 bulan terakhir</span>' +
        '<span><i class="ti">' + SKA_ICON.cal + '</i><b>' + r.visits7 + '</b>kegiatan 7 hari terakhir</span><span><i class="ti">' + SKA_ICON.clock + '</i><b>' + r.followDue + '</b>tindak lanjut jatuh tempo</span>' +
        '<span><i class="ti">' + SKA_ICON.target + '</i><b>' + (r.newTargets ? r.newStarted + ' dari ' + r.newTargets : '-') + '</b>target baru dimulai</span><span' + (r.overdue > 0 ? ' class="bad"' : '') + '><i class="ti">' + SKA_ICON.alert + '</i><b>' + rp(r.overdue) + '</b>tagihan lewat tempo</span></span>' +
        '<div class="btnrow"><button class="btn teal" onclick="teamFilter(\'' + jsq(r.name) + '\')">Lihat sekolah</button>' +
        (r.history ? '<button class="btn" onclick="teamHistory(\'' + jsq(r.name) + '\')">Lihat riwayat</button>' : '') + '</div></div>';
  }).join('');
}
// One person's order history (the same numbers that person sees in "Order saya"), in a sheet.
function teamHistory(name) {
  var d = SKA.data, r = (d.team || []).filter(function (x) { return x.name === name; })[0];
  if (!r || !r.history) return;
  openSheet('<h2>Riwayat ' + esc(name) + '</h2><p class="muted small" style="margin-top:-4px">Order dari sekolah pegangan ' + esc(name) + ', dan kegiatannya.</p>' +

}
function teamFilter(name) {
  SKA.salesFilter = name === 'Belum ada sales' ? '(kosong)' : name; SKA.filter = 'all'; SKA.search = '';
  go('schools');
}

// Kabar: news about the viewer's schools, then the general list. Area news shows for a sales only
// when there is none about their schools (marked as not about them directly); the Manajer always
// gets it, after the school news.
function kabarBody(d) {
  var mgr = isMgr(d), ks = d.kabarSekolah, kw = d.kabarWilayah || [], ku = d.kabar || [], h = '';
  var own = mgr ? 'Kabar sekolah target' : 'Kabar sekolah Anda';
  if (ks && ks.length) h += '<div class="sub3">' + own + '</div>' + ks.map(function (k) { return schoolNews(k, mgr); }).join('');
  if (ks && kw.length && (mgr || !ks.length)) {
    var area = mgr ? '' : (d.lists && d.lists.areas && d.lists.areas[d.kabarArea]) || kw[0].areaLabel || '';
    h += '<div class="sub3">Kabar wilayah' + (area ? ' ' + esc(area) : '') + '</div><p class="muted small" style="margin:2px 0 0">' +
      (mgr ? 'Bukan tentang sekolah target langsung.' : 'Bukan tentang sekolah Anda langsung.') + '</p>' + kw.map(function (k) { return newsItem(k, mgr ? k.areaLabel : ''); }).join('');
  } else if (ks && !ks.length) h += '<div class="sub3">' + own + '</div><p class="muted">' + (mgr ? 'Belum ada kabar tentang sekolah target bulan ini.' : 'Belum ada kabar tentang sekolah Anda bulan ini.') + '</p>';
  h += '<div class="sub3">Kabar umum</div>';
  if (ku.length) {
    h += ku.slice(0, 3).map(function (k) { return newsItem(k); }).join('');
    if (ku.length > 3) h += '<button class="btn block" style="margin-top:10px" onclick="vKabar()">Lihat semua kabar umum (' + ku.length + ')</button>';
  } else h += '<p class="muted">Belum ada kabar umum minggu ini.</p>';
  return h + '<p class="muted small" style="margin-top:12px">Otomatis dari judul berita. Cek sumbernya sebelum bertindak.</p>';
}
// area: the area name shown with the category (Manajer's area news covers every area).
function newsItem(k, area) {
  return '<div class="item news"><span class="t"><span class="tag">' + esc(k.cat) + (area ? ' · ' + esc(area) : '') + '</span>' +
    '<a class="t2" href="' + esc(k.link) + '" target="_blank" rel="noopener">' + esc(k.title) + '</a>' +
    '<span class="act2">' + esc(k.action) + '</span><span class="src">' + esc(k.source) + (k.date ? ' · ' + esc(tgl(k.date)) : '') + '</span></span></div>';
}
function schoolNews(k, mgr) {
  return '<div class="item news"><div class="t"><span class="tag">' + esc(k.cat) + '</span><br>' +
    '<button class="chip sn" onclick="go(\'school\',\'' + jsq(k.key) + '\')">' + esc(k.schoolName) + (mgr && k.sales ? ' · ' + esc(k.sales) : '') + '</button>' +
    '<a class="t2" href="' + esc(k.link) + '" target="_blank" rel="noopener">' + esc(k.title) + '</a>' +
    '<div class="act2">' + esc(k.action) + '</div><div class="src">' + esc(k.source) + (k.date ? ' · ' + esc(tgl(k.date)) : '') + '</div></div></div>';
}
function vKabar() {
  openSheet('<h2>Kabar umum minggu ini</h2><p class="muted small" style="margin-top:-4px">Otomatis dari judul berita. Cek sumbernya sebelum bertindak.</p>' +
    SKA.data.kabar.map(function (k) { return newsItem(k); }).join('') + '<button class="btn block" style="margin-top:14px" onclick="closeSheet()">Tutup</button>');
}

// Filter chips. Klien = Status Klien in the tracker or an order in the last 24 months; Target baru =
// every other school (Firman's new targets and prospects added on the phone).
var SKA_FILTERS = [['all', 'Semua'], ['client', 'Klien'], ['new', 'Target baru'], ['red', 'Perlu dihubungi'], ['nocontact', 'Tanpa No HP']];
function isClient(s, today) { var n = s.lastOrder ? dayDiff(s.lastOrder, today) : null; return s.status === 'Klien' || (n !== null && n < 730); }
// Manajer: clients without an order in the last 12 months (Beranda's insight opens it).
function filtersFor(d) { return isMgr(d) ? SKA_FILTERS.concat([['lapsed', 'Belum order 12 bulan']]) : SKA_FILTERS; }
function passFilter(s, f, today) {
  if (f === 'lapsed') return lapsedClient(s, today);
  if (f === 'client') return isClient(s, today);
  if (f === 'new') return !isClient(s, today);
  if (f === 'red') return s.color === 'red';
  if (f === 'nocontact') return !phoneOk(s.picPhone);
  return true;
}
// Manajer's sales filter ('' = all, '(kosong)' = no sales); a sales account always sees its own list.
function salesMatch(s) {
  var f = SKA.salesFilter;
  if (!f || !isMgr(SKA.data)) return true;
  return f === '(kosong)' ? !s.sales : String(s.sales || '').toLowerCase().trim() === f.toLowerCase().trim();
}
function salesChips(d) {
  var names = d.team ? d.team.filter(function (r) { return r.sales || r.schools > 0; }).map(function (r) { return r.name === 'Belum ada sales' ? '(kosong)' : r.name; })
    : d.salesNames.concat(['Kantor', '(kosong)']);
  return [''].concat(names);
}
function vSchools(d) {
  var mgr = isMgr(d), base = d.schools.filter(salesMatch), cl = d.lists && d.lists.colors;
  var fl = filtersFor(d);
  if (!fl.some(function (f) { return f[0] === SKA.filter; })) SKA.filter = 'all';
  var who = mgr && SKA.salesFilter ? ' · ' + (SKA.salesFilter === '(kosong)' ? 'Belum ada sales' : SKA.salesFilter) : '';
  var cur = fl.filter(function (f) { return f[0] === SKA.filter; })[0], shown = base.filter(function (s) { return passFilter(s, SKA.filter, d.today); }).length;
  setTop('<div><div class="sub">' + (SKA.filter !== 'all' ? shown + ' dari ' + base.length + ' sekolah · ' + esc(cur[1]) : base.length + ' sekolah') + esc(who) + '</div><h1>' + (mgr ? 'Semua Sekolah' : 'Sekolah Saya') + '</h1></div>');
  // Firman 10 Nov: "Baru" sits beside the search field (as on Catat), not in the header
  var h = '<div class="pickrow" style="margin-top:14px"><input id="sSearch" type="search" placeholder="Cari nama sekolah" value="' + esc(SKA.search) + '" oninput="SKA.search=this.value;drawSchoolList()">' +
    '<button class="btn" onclick="addSchoolSheet()">+ Baru</button></div>';
  // Chip rows scroll sideways and the colour key is folded, so a small phone (or large text) still
  // shows the first schools on the first screen.
  if (mgr && (d.team ? d.team.length : d.salesNames.length)) {
    h += '<div class="seg">' + salesChips(d).map(function (n) {
      return '<button class="chip' + (SKA.salesFilter === n ? ' on' : '') + '" onclick="SKA.salesFilter=\'' + jsq(n) + '\';render()">' + esc(n === '(kosong)' ? 'Belum ada sales' : n || 'Semua sales') + '</button>';
    }).join('') + '</div>';
  }
  h += '<div class="seg">' + fl.map(function (f) {
    var n = base.filter(function (s) { return passFilter(s, f[0], d.today); }).length;
    return '<button class="chip' + (SKA.filter === f[0] ? ' on' : '') + '" onclick="SKA.filter=\'' + f[0] + '\';render()">' + f[1] + ' (' + n + ')</button>';
  }).join('') + '</div>';
  h += '<details class="keybox"><summary>Arti warna</summary><div class="legend">' + (cl ? '<span><i class="dot green"></i>' + esc(cl.green) + '</span><span><i class="dot yellow"></i>' + esc(cl.yellow) + '</span>' +
    '<span><i class="dot red"></i>' + esc(cl.red) + ': belum order 12 bulan dan ' + d.settings.redDays + ' hari tidak dihubungi</span><span><i class="dot grey"></i>' + esc(cl.grey) + ': belum pernah order dan belum pernah dihubungi</span>'
    : '<span><i class="dot green"></i>Sudah order tahun ini</span><span><i class="dot yellow"></i>Sudah dihubungi, belum order</span><span><i class="dot red"></i>' + d.settings.redDays + ' hari belum dihubungi</span>') + '</div>' +
    (d.schools.some(function (s) { return s.tier; }) ? '<div class="legend"><span><i class="tier">BOS besar</i>sepertiga sekolah target dengan Estimasi BOS 2027 terbesar, lalu BOS sedang dan BOS kecil</span></div>' : '') + '</details>';
  return h + '<div id="sList"></div>';
}
// Order: red, yellow, green, grey; then never contacted, longest without contact, tier, name (numbers in order).
function drawSchoolList() {
  var d = SKA.data, q = SKA.search.toLowerCase().trim(), mgr = isMgr(d), rank = { red: 0, yellow: 1, green: 2, grey: 3 }, tr = { A: 1, B: 2, C: 3 };
  var l = d.schools.filter(function (s) {
    return salesMatch(s) && passFilter(s, SKA.filter, d.today) && (!q || s.name.toLowerCase().indexOf(q) >= 0);
  }).sort(function (a, b) {
    return (rank[a.color] || 0) - (rank[b.color] || 0) || (b.since === null) - (a.since === null) || (b.since || 0) - (a.since || 0) ||
      (tr[a.tier] || 4) - (tr[b.tier] || 4) || nameCmp(a.name, b.name);
  });
  var el = $('sList'); if (!el) return;
  var by12 = d.schools.length && typeof d.schools[0].omzet12 === 'number', Y = d.today.slice(0, 4);
  el.innerHTML = l.length ? l.map(function (s) {
    var meta = (s.color === 'grey' ? 'Belum mulai' : sinceTxt(s)) + (mgr ? ' · ' + salesLabel(s.sales) : '') + (s.status === 'Prospek' && s.color !== 'grey' ? ' · Prospek' : '');
    var v = by12 ? s.omzet12 : s.omzetYear;
    return '<button class="item srow2" onclick="go(\'school\',\'' + jsq(s.key) + '\')">' + schoolThumb(s.color, s) + '<span class="t"><b>' + esc(s.name) + '</b>' +
      (s.tier ? '<span class="tl"><i class="tier t' + esc(s.tier) + '">' + esc(tierLabel(s.tier)) + '</i></span>' : '') + '<span class="mt">' + SKA_ICON.clock + esc(meta) + '</span></span>' +
      '<span class="r"><b>' + (v ? rp(v) : 'Rp 0') + '</b>' + (by12 ? '12 bulan' : Y) + '</span><span class="chev">' + SKA_ICON.right + '</span></button>';
  }).join('') : '<p class="muted">Tidak ada sekolah yang cocok.</p>';
}

// Intro message from Pengaturan "Pesan WA". Without a catalog link the lines about the catalog are
// left out, so the school never reads "here is our catalog" followed by nothing.
function waText(s) {
  var d = SKA.data, tpl = d.settings.wa || '';
  if (!d.settings.catalog) {
    var keep = tpl.split('\n').filter(function (l) { return !/katalog/i.test(l); }).join('\n');
    if (keep.replace(/\s+/g, '')) tpl = keep;
  }
  if (/^(bu|ibu|pak|bapak|bpk|bp)\.?\s/i.test(s.pic || '')) tpl = tpl.replace(/Bapak\/Ibu\s+\{pic\}/g, '{pic}');
  return tpl.replace(/\{waktu\}/g, waktu()).replace(/\{pic\}/g, s.pic || '').replace(/\{sales\}/g, d.me.name)
    .replace(/\{sekolah\}/g, s.name).replace(/\{katalog\}/g, d.settings.catalog || '').replace(/Bapak\/Ibu\s+,/g, 'Bapak/Ibu,').replace(/\n{3,}/g, '\n\n').trim();
}
function waHref(s) {
  var p = String(s.picPhone || '').replace(/\D+/g, ''); if (/^0/.test(p)) p = '62' + p.slice(1);
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(waText(s));
}

// School detail. The Target 2027 cell (20% of BOS) is a potential, not a target: Sales never see it
// (a newer server sends 0) nor the Serapan measured against it; the Manajer sees "Potensi (20% BOS)"
// and Serapan. A school that never ordered gets one "Order: Belum pernah" row instead of five

// without any order under its name is most likely a spelling twin, so a note says to check it).
function vSchool(d) {
  var s = school(SKA.key), mgr = isMgr(d), Y = d.today.slice(0, 4), days = d.settings.overdueDays || 25;

  var never = !s.lastOrder && !(s.omzet12 > 0) && !s.omzetYear && !s.prevYear && !Object.keys(s.byYear || {}).length, share = mgr && !never && typeof s.share === 'number';
  var tw = SKA_TIER[s.tier] || '';
  var h = '<div class="card" style="margin-top:-10px"><div style="display:flex;align-items:center;gap:10px"><span class="dot ' + esc(s.color) + '"></span><b style="color:var(--ink)">' + esc(label) + '</b></div>' +
    '<div class="muted small" style="margin-top:4px">Kontak terakhir: ' + esc(s.lastContact ? tgl(s.lastContact) + ' (' + sinceTxt(s) + ')' : 'belum pernah dicatat') + '</div>' +
    '<dl class="kv" style="margin-top:14px">' + (never ? '<dt>Order</dt><dd>Belum pernah</dd>' : '<dt>Omzet ' + Y + '</dt><dd>' + rp(s.omzetYear) + '</dd><dt>Bulan ini</dt><dd>' + rp(s.omzetMonth) + '</dd>' +
    '<dt>Tahun lalu</dt><dd>' + rp(s.prevYear) + '</dd>' + (typeof s.omzet12 === 'number' ? '<dt>12 bulan terakhir</dt><dd>' + rp(s.omzet12) + '</dd>' : '') +
    '<dt>Order terakhir</dt><dd>' + esc(tgl(s.lastOrder)) + '</dd>') +
    '<dt>Jumlah siswa</dt><dd>' + (s.students ? esc(String(s.students).replace(/\B(?=(\d{3})+(?!\d))/g, '.')) : '-') + '</dd>' +
    (tw ? '<dt>Ukuran BOS</dt><dd>' + esc(tw.charAt(0).toUpperCase() + tw.slice(1)) + '</dd>' : '') +
    (s.bos ? '<dt>Estimasi BOS 2027</dt><dd>' + rp(s.bos) + '</dd>' : '') +
    (potential ? '<dt>Potensi (20% BOS)</dt><dd>' + rp(potential) + '</dd>' : '') +

// ---------- KPI and incentive (app 1.4.0, server Kpi.js; own tab since 1.5.0) ----------
// Tab KPI: a sales sees her own (screen 'kp'), the Manajer the team (screen 'kpteam', one tap to
// that sales' 'kp'). Top down: the verdict and why, where this month leaves the next review (k.fc,
// server 1.5.0), what to do this week, the indicators, the incentive, the months, and how it is all
// counted. The rules are Firman's (tab Aturan KPI); the app never changes a level.
var SKA_KST = { naik: ['g', 'Siap naik level'], aman: ['g', 'Aman'], turun: ['r', 'Zona turun level'], baru: ['', 'Belum ada bulan penuh'] };
// 'yyyy-MM-dd HH:mm' from the server as 5 Nov, 09:47.

function kpcDec(x) { return String(Math.round(x * 1000) / 10).replace('.', ',') + '%'; }
function bln(ym) { return SKA_BULAN[+ym.slice(5, 7) - 1] + (ym.slice(0, 4) !== String(new Date().getFullYear()) ? ' ' + ym.slice(0, 4) : ''); }
function ymAdd(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
function blnRange(list) { return list && list.length ? (list.length > 1 ? bln(list[0]) + ' s.d. ' + bln(list[list.length - 1]) : bln(list[0])) : 'belum ada bulan penuh'; }

function kstTag(k) { var s = SKA_KST[k.status] || SKA_KST.aman; return '<i class="kst' + (s[0] ? ' ' + s[0] : '') + '">' + esc(s[1]) + '</i>'; }
// A checklist line: ok = fine, mid = not at the line to go up yet, no = in the zone or short.
// A KPI card line (2.0): the indicator's icon in a circle coloured by its state, label, value, the lines.
function kmet(cls, icon, label, val, sub) {
  return '<div class="kmet ' + cls + '"><i class="mi">' + SKA_ICON[icon] + '</i><span><b>' + esc(label) + '</b><em>' + esc(sub) + '</em></span><strong>' + esc(val) + '</strong></div>';
}
function kmark(cls, html) { return '<div><i class="' + cls + '">' + (cls === 'ok' ? '&#10003;' : cls === 'no' ? '!' : '&#9675;') + '</i><span>' + html + '</span></div>'; }

    '<div class="sub">' + esc(k ? 'Level ' + k.level + (f ? ', penilaian berikutnya ' + tglPanjang(f.review) : '') : 'Aturan dari Mas Firman, tab Aturan KPI') + '</div></div>');
  if (!k) return '<div class="note amber" style="margin-top:16px">' + esc(d.kpiError || 'KPI belum tersedia.') + '</div>';
  return kpStatus(k) + kpForecast(k) + kpSteps(d, k) + kpInd(k) + kpPay(k) + kpMonths(k) + kpHelp(k);
}
// The verdict in one sentence, then each indicator against its lines.
function kpStatus(k) {
  var head;
  if (k.status === 'naik') head = 'Ketiga syarat naik ke ' + k.next + ' terpenuhi. Keputusan naik level tetap dari Mas Firman.';
  else if (k.status === 'turun') head = (k.prev ? 'Bisa turun ke ' + k.prev : 'Masa probation bisa tidak lulus') + ' bila angka di bawah tidak membaik. Perkiraan dan langkahnya ada di bawah.';
  else if (k.status === 'baru') head = 'Belum ada bulan penuh di level ini, jadi belum ada penilaian. Perkiraan bulan ini ada di bawah.';
  else head = k.next ? 'Tidak di zona turun. Belum semua syarat naik ke ' + k.next + ' terpenuhi.' : 'Tidak di zona turun. Senior adalah level tertinggi: jaga omzet dan tagihan di atas batas.';
  if (k.partial && k.status !== 'baru') head += ' Baru ' + k.monthsHeld + ' bulan penuh di level ini; penilaian lengkap setelah bulan berikutnya.';
  var kb = SKA_KST[k.status] || SKA_KST.aman;
  return '<div class="float kstat rise" style="--i:0"><div class="kbig' + (kb[0] ? ' ' + kb[0] : '') + '">' + (kb[0] === 'g' && SKA_ART.ic_shield ? '<img src="' + SKA_ART.ic_shield + '" alt="" width="40" height="40">' : SKA_ICON.shield) + esc(kb[1]) + '</div><p>' + esc(head) + '</p>' + (k.status === 'baru' ? '' : kpWhy(k)) + '<div class="muted small" style="margin-top:8px">' +
    (k.levelSet ? 'Level ' + esc(k.level) + (k.since ? ' sejak ' + esc(tglPanjang(k.since)) : '') : 'Level belum diisi Mas Firman; sementara dihitung Probation') + '</div></div>';
}
function kpWhy(k) {
  var o = k.ind.omzet, a = k.ind.aging, s = k.ind.sekolah, up = !!k.next;
  var one = function (label, x, icon) {
    var useDown = x.isDown || !up, sub = 'zona turun ' + kpc(x.down) + ' atau kurang' + (up && x.line !== null ? ', naik minimal ' + kpc(x.line) : '') + ' (' + blnRange(useDown ? x.monthsDown : x.months) + ')';
    return kmet(x.isDown ? 'no' : up && !x.ok ? 'mid' : 'ok', icon, label, kpc(useDown ? x.valueDown : x.value), sub);
  };
  return '<div class="kwhy kmets">' + one('Omzet rata-rata', o, 'chart') + one('Tagihan lunas tepat waktu', a, 'clock') +
    (up ? kmet(s.ok ? 'ok' : 'mid', 'school', 'Sekolah baru', s.value + ' dari ' + s.line, nbRp('order pertama minimal ' + rp(s.min) + ' (' + blnRange(s.months) + ')')) : '') + '</div>';

// Where this month leaves the next review (server k.fc): the verdict if the month ends at today's
// pace with every invoice due this month paid on time, then omzet, the invoices falling due and the
// new schools, each with what is still missing.
function kpForecast(k) {
  var f = k.fc; if (!f) return '';
  var t = f.target, M = SKA_BULAN_PANJANG[+f.month.slice(5, 7) - 1], pct = t ? f.omzet / t : 0, zone = k.status === 'turun', ad = f.agingDown || {}, lines = [];
  var win = blnRange([ymAdd(f.month, 1 - (k.rules.turunBulan || 3)), f.month]); // the months the next review weighs
  var li = function (cls, txt) { lines.push(kmark(cls, esc(nbRp(txt)))); };
  if (f.safe !== null) {
    if (f.safe === 0) li('ok', 'Omzet tetap di atas batas zona turun walau tanpa order lagi bulan ini.');
    else if (f.omzet >= f.safe) li('ok', 'Omzet ' + M + ' sudah cukup untuk ' + (zone ? 'keluar dari' : 'tetap di luar') + ' zona turun.');
    else li('no', 'Supaya ' + (zone ? 'keluar dari' : 'tidak masuk') + ' zona turun: omzet ' + M + ' minimal ' + rp(f.safe) + ', kurang ' + rp(f.safe - f.omzet) + '.');
  }
  if (f.up !== null && k.next) li(f.omzet >= f.up ? 'ok' : 'mid', f.omzet >= f.up ? 'Syarat omzet naik ke ' + k.next + ' sudah terpenuhi bulan ini.' : 'Supaya syarat omzet naik ke ' + k.next + ' terpenuhi: minimal ' + rp(f.up) + ', kurang ' + rp(f.up - f.omzet) + '.');
  li(f.omzet >= t ? 'ok' : 'mid', (f.omzet >= t ? 'Target ' + M + ' tercapai.' : 'Ke target penuh ' + rp(t) + ': kurang ' + rp(t - f.omzet) + '.') + ' Di atas target, setiap Rp 10 jt menambah insentif ' + rp(f.per10) + '.');
  var ag = f.pendingCount ? '<p class="small" style="margin:14px 0 4px;color:var(--ink)">' + esc(nbRp(f.pendingCount + ' tagihan (' + rp(f.pendingRp) + ') jatuh tempo bulan ini dan belum lunas. Bila semua lunas sebelum jatuh tempo, tagihan lancar ' + win + ' jadi ' +
      kpc(ad.best) + ' (zona turun ' + kpc(k.ind.aging.down) + ' atau kurang).')) + '</p><div class="lrows" style="margin-top:0">' + f.pending.map(function (x) {
      return '<button class="lrow kpend"' + (x.key ? ' onclick="openSchool(\'' + jsq(x.key) + '\')"' : '') + '><span>' + esc(x.name) + '<em>' + esc((x.inv ? x.inv + ', ' : '') + 'jatuh tempo ' + tgl(x.due)) + '</em></span><b>' + esc(nbRp(rp(x.amount))) + '</b></button>';
    }).join('') + (f.pendingCount > f.pending.length ? '<p class="muted small">dan ' + (f.pendingCount - f.pending.length) + ' tagihan lainnya</p>' : '') + '</div>'
    : '<p class="muted small" style="margin:14px 0 0">Tidak ada tagihan yang menunggu jatuh tempo bulan ini. Tagihan lancar ' + esc(win) + ' sekarang ' + (ad.now === null || ad.now === undefined ? '100%' : kpc(ad.now)) + '.</p>';
  var sk = f.sekolah ? '<p class="small" style="margin:12px 0 0;color:var(--ink)">' + esc(nbRp('Sekolah baru ' + f.sekolah.have + ' dari ' + f.sekolah.line + ' dalam ' + (k.rules.naikSekolahBulan || 3) + ' bulan sampai ' + M +
    (f.sekolah.have >= f.sekolah.line ? ': syarat terpenuhi.' : ': perlu ' + (f.sekolah.line - f.sekolah.have) + ' lagi dengan order pertama minimal ' + rp(k.ind.sekolah.min) + '.'))) + '</p>' : '';
  var upR = f.up !== null && t ? f.up / t : null, dnR = f.safe && t ? f.safe / t : null;
  return '<div class="caption kcap">' + (SKA_ART.ic_trophy ? '<img src="' + SKA_ART.ic_trophy + '" alt="" width="28" height="28">' : SKA_ICON.trophy) + 'Menuju penilaian ' + esc(tglPanjang(f.review)) + '</div>' +
    (f.periodLabel ? '<p class="muted small kper">Periode insentif ' + esc(f.periodLabel) + (f.payday ? ', dibayar ' + esc(tglPanjang(f.payday)) : '') + '.</p>' : '') + '<div class="float kfc rise" style="--i:1">' +
    '<div class="khead"><b class="kq">Perkiraan hasil</b>' + kstTag({ status: f.next }) + '</div>' +
    '<p class="muted small" style="margin:4px 0 0">' + esc((f.pace !== null ? 'Bila order sampai akhir ' + M + ' secepat sekarang' : 'Dengan omzet sejauh ini') + ' dan tagihan yang jatuh tempo bulan ini lunas tepat waktu.' +
      (f.nextPartial ? ' Penilaian belum lengkap: bulan penuh di level ini masih kurang.' : '')) + '</p>' +
    '<div class="ktitle" style="margin-top:14px"><b>Omzet ' + esc(M) + '</b><span>' + esc(nbRp(rp(f.omzet))) + '</span></div>' +
    '<div class="muted small">' + esc(nbRp(kpc(pct) + ' dari target ' + rp(t) + ', hari ke-' + f.day + ' dari ' + f.days)) + '</div>' +
    kbar(pct, upR, dnR) + klegend(upR, nbRp(rp(f.up)), dnR, nbRp(rp(f.safe)) + ' atau kurang') +
    '<p class="muted small" style="margin:6px 0 0">' + esc(f.pace !== null ? nbRp('Kecepatan sekarang: sekitar ' + rp(f.pace) + ' di akhir bulan.') : 'Perkiraan kecepatan muncul mulai tanggal 8.') + '</p>' +
    '<div class="kwhy">' + lines.join('') + '</div>' + ag + sk + '</div>';
}
// What to do this week, from the weakest numbers. A sales gets a button to the list that does it;
// the Manajer reads the same steps as advice for that sales.
function kpSteps(d, k) {
  var f = k.fc || {}, mgr = isMgr(d), steps = [], od = (d.tagihan || []).length;
  var step = function (txt, btn, onclick) {
    steps.push('<div class="kstep"><p>' + esc(nbRp(txt)) + '</p>' + (mgr || !btn ? '' : '<button class="link" onclick="' + onclick + '">' + esc(btn) + SKA_ICON.right + '</button>') + '</div>');
  };
  // Out of the zone first; the line to go up only once that is safe.
  var safeGap = f.safe > f.omzet ? f.safe - f.omzet : 0, upGap = k.next && f.up > f.omzet ? f.up - f.omzet : 0;
  if (safeGap || upGap) step('Kejar omzet ' + rp(safeGap || upGap) + ' lagi bulan ini agar ' + (safeGap ? (k.status === 'turun' ? 'keluar dari' : 'tidak masuk') + ' zona turun' : 'syarat omzet naik ke ' + k.next + ' terpenuhi') +
    '. Mulai dari sekolah yang paling siap order di Tugas minggu ini.', 'Buka Tugas minggu ini', 'go(\'tasks\')');
  if (f.pendingCount) step('Ingatkan ' + f.pendingCount + ' sekolah sebelum tagihannya jatuh tempo bulan ini. Daftarnya ada di Perkiraan.', '', '');
  if (!mgr && od) step(od + ' invoice sudah lewat tempo. Makin cepat lunas, makin baik nilai tagihan lancar bulan depan.', 'Buka Tagihan', 'go(\'tagihan\')');
  if (f.sekolah && f.sekolah.have < f.sekolah.line) step('Cari ' + (f.sekolah.line - f.sekolah.have) + ' sekolah baru dengan order pertama minimal ' + rp(k.ind.sekolah.min) + '.', 'Lihat target baru', 'showNewTargets()');
  if (!steps.length) step('Semua angka aman. Jaga ritme kunjungan dan tagih sebelum jatuh tempo.', '', '');
  return '<div class="caption">' + (mgr ? 'Saran untuk ' + esc(k.name) : 'Langkah minggu ini') + '</div><div class="float rise" style="--i:2">' + steps.join('') + '</div>';
}
function showNewTargets() { SKA.filter = 'new'; SKA.salesFilter = ''; SKA.search = ''; go('schools'); SKA.linkFilter = true; }
// Bar from 0 to 120%: the green mark is the line to go up, the red one the line to go down.
function kbar(v, up, down) {
  var w = function (x) { return Math.max(0, Math.min(100, x / 1.2 * 100)); }, cls = down !== null && v !== null && v <= down ? ' r' : up !== null && v !== null && v >= up ? ' g' : '';
  return '<div class="kbar"><i class="b' + cls + '" style="width:' + w(v || 0) + '%"></i>' + (down !== null ? '<s class="dn" style="left:' + w(down) + '%"></s>' : '') +
    (up !== null ? '<s class="up" style="left:' + w(up) + '%"></s>' : '') + '</div>';
}

  var x = (SKA.custD || {})[SKA.custKey], s = x && x.sjs ? x.sjs.filter(function (y) { return y.no === SKA.key; })[0] : null;

  if (!x) { loadCustD(SKA.custKey); return '<p class="muted" style="margin-top:16px">Memuat...</p>'; }

  var h = '<div class="tags" style="margin-top:14px"><i class="tag ' + (SKA_SJ[s.status] || '') + '">' + esc(s.status) + '</i></div>' + sjDoc(s, x.name, x);
  h += '<div class="btnrow" style="margin-top:12px"><button class="btn brand" onclick="docRun(\'print\',\'skxSjPdf\',\'' + jsq(s.no) + '\')">Cetak</button>' +

    h += '<div class="caption">Kirim barang</div><div class="card"><p class="muted small" style="margin:0">Foto barang saat diserahkan, atau foto surat jalan yang sudah ditandatangani. Bisa juga nomor resi kurir.</p>' +
      (sh && sh.photo ? '<div class="photo"><img src="' + esc(sh.photo) + '" alt="Foto bukti kirim"><button class="btn" onclick="shipPhoto()">Ganti foto</button></div>'
        : '<button class="btn block" style="margin-top:10px" onclick="shipPhoto()">' + SKA_ICON.cam + 'Ambil foto bukti kirim</button>') +
      '<div class="field"><label for="shOther">Bukti lain <span class="muted small">(boleh kosong)</span></label><input id="shOther" type="text" placeholder="Contoh: resi kurir 1234" value="' + esc(sh ? sh.other : '') + '" oninput="shipState().other=this.value"></div>' +
      '<div id="shErr" class="err hide"></div><button class="btn amber block" style="margin-top:14px" onclick="shipSj()">Tandai sudah dikirim</button></div>' +

    h += '<div class="caption">Bukti kirim</div><div class="card"><dl class="kv"><dt>Dikirim</dt><dd>' + esc(stampTxt(s.sent)) + '<br><span class="muted small">' + esc(s.sentBy) + '</span></dd>' +
      (s.other ? '<dt>Bukti lain</dt><dd>' + esc(s.other) + '</dd>' : '') + (s.status === 'Diterima' ? '<dt>Diterima</dt><dd>' + esc(stampTxt(s.got)) + '<br><span class="muted small">' + esc(s.gotBy) + '</span></dd>' : '') + '</dl>' +
      (s.checks && s.checks.some(function (c) { return !c.ok; }) ? '<div class="note amber"><b>Selisih dari sekolah:</b> ' + s.checks.map(function (c, i) {
        return c.ok ? '' : esc((s.lines[i] || {}).item) + ': ' + esc(c.ket.toLowerCase()) + ' ' + esc(c.diff);
      }).filter(String).join('; ') + '</div>' : '') +
      (s.schoolNote ? '<div class="note"><b>Catatan sekolah:</b> ' + esc(s.schoolNote) + '</div>' : '') +
      sjAnswers(s).map(function (a) { return '<div class="note"><b>Tanggapan admin:</b> ' + esc(a) + '</div>'; }).join('') +
      (sjIssue(s) ? '<button class="btn amber block" style="margin-top:10px" onclick="sjAnswerSheet()">Tanggapi selisih</button>' : '') +
      (s.photo ? sjPhotoBox(s.no) : '') + (s.status === 'Dikirim' ? '<p class="muted small" style="margin:10px 0 0">Menunggu sekolah mengonfirmasi barang diterima di aplikasi SNAPP.</p>' : '') +

  } else h += '<div class="note" style="margin-top:12px">Surat jalan ini dibatalkan. ' + esc(s.note) + '</div>';

}
// 9 Nov (Firman): the admin answers a short or damaged delivery, and messages the school PIC about a
// delivery note or an invoice. Answers live as "Tanggapan admin ..." lines in the note's Catatan.
function sjIssue(s) { return !!(s && (s.status === 'Diterima' || s.status === 'Dikirim') && ((s.checks && s.checks.some(function (c) { return !c.ok; })) || s.schoolNote)); }
function sjAnswers(s) { return String((s && s.note) || '').split('\n').filter(function (l) { return /^Tanggapan admin /.test(l); }).map(function (l) { return l.replace(/^Tanggapan admin /, ''); }); }
function picPhone(x) { var p = (x && x.profile) || {}; return phoneOk(p.phone || (x && x.trackerPhone)); }
function picWa(x, msg, label) {
  var ph = picPhone(x);
  return ph ? '<a class="btn wa block" style="margin-top:10px" href="https://wa.me/62' + esc(ph.slice(1)) + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">' + SKA_ICON.wa + esc(label) + '</a>'
    : '<p class="muted small" style="margin:10px 0 0">Nomor PIC belum ada; isi di profil sekolah agar bisa dikabari lewat WhatsApp.</p>';
}
function picHello(x) { var p = (x && x.profile) || {}; return 'Selamat ' + waktu() + ' Bapak/Ibu' + (p.pic ? ' ' + p.pic : '') + ', '; }
function snappLine() { var l = (SKA.data.settings || {}).custLink || ''; return l ? '\nAplikasi SNAPP: ' + l : ''; }
function sjWaText(s, x) {
  var a = sjAnswers(s), last = a.length ? a[a.length - 1].replace(/^[^:]*\):\s*/, '') : '';
  if (last) return picHello(x) + 'terkait surat jalan ' + s.no + ' (invoice ' + s.inv + '): ' + last + '\nTerima kasih.';
  if (s.status === 'Dikirim') return picHello(x) + 'barang untuk invoice ' + s.inv + ' sudah kami kirim dengan surat jalan ' + s.no + '. Mohon dicek, lalu konfirmasi barang diterima di aplikasi SNAPP.' + snappLine() + '\nTerima kasih.';
  if (s.status === 'Diterima') return picHello(x) + 'terima kasih, barang surat jalan ' + s.no + ' (invoice ' + s.inv + ') sudah dikonfirmasi diterima.';
  return picHello(x) + 'surat jalan ' + s.no + ' untuk invoice ' + s.inv + ' sedang kami siapkan.' + snappLine();
}
function invWaText(i, x) {
  return picHello(x) + 'invoice ' + i.inv + ' untuk ' + (x.name || 'sekolah') + ' tanggal ' + tglPanjang(i.date) + ' sebesar ' + rpPenuh(i.total) + ' sudah terbit. Mohon dicek dan dikonfirmasi di aplikasi SNAPP.' + snappLine() + '\nTerima kasih.';
}

function saveContact() {
  var key = SKA.contactKey, then = SKA.contactThen; if (!school(key)) { closeSheet(); return; }
  busy(true, 'Menyimpan...');
  call('skxContact', SKA.token, key, $('cPic').value, $('cPhone').value).then(function (r) {
    var s = school(key); // looked up again: a reload may have replaced the data meanwhile

    store('skx_home', JSON.stringify(SKA.data)); closeSheet(); render(); toast('Kontak disimpan.');

    loadHome(false); // recommendation buttons and reminders now have the number

// One listener on the bar: its buttons are rebuilt per role (setNav).
document.querySelector('.nav').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button[data-nav]') : null;
  if (b) { var v = b.getAttribute('data-nav'); go(v, v === 'log' ? '' : undefined); }
});
$('lgBtn').addEventListener('click', doLogin);
$('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
(function nativeSetup() {
  if (window.SKX_API) {
    var v = document.createElement('p');
    v.className = 'muted small';
    v.textContent = 'Versi ' + window.SKX_API.version + ' ';
    if (/^https:\/\//.test(window.SKX_API.privacy || '')) {
      var pl = document.createElement('a');
      pl.href = window.SKX_API.privacy; pl.target = '_blank'; pl.rel = 'noopener'; pl.textContent = 'Kebijakan privasi';
      v.appendChild(document.createTextNode(String.fromCharCode(183) + ' ')); v.appendChild(pl);
    }
    $('vLogin').appendChild(v);
  }
  var launcher = nativePlugin('AppLauncher'), app = nativePlugin('App');
  if (launcher) {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.classList.contains('off')) return;
      var href = a.getAttribute('href');
      if (!/^(tel:|https?:)/.test(href)) return;
      e.preventDefault();
      launcher.openUrl({ url: href }).catch(function () { toast('Tautan tidak bisa dibuka di HP ini.'); });
    });
  }
  if (app) {
    app.addListener('resume', function () { flushQueue(); }); // back from the background: send what waits
    app.addListener('backButton', function () {
      if (!$('sheet').classList.contains('hide')) { closeSheet(); return; }
      if (SKA.view === 'school') { goBack(); return; }
      if (SKA.view === 'ainvoice') { go('ainvoices'); return; }
      if (SKA.view === 'kp' && isMgr(SKA.data)) { go('kpteam'); return; }
      if (SKA.view === 'acustd') { go('acust'); return; }
      if (SKA.view === 'asj' || SKA.view === 'asjnew') { go('acustd', SKA.custKey); return; }
      if (SKA.view === 'log' && SKA.logFrom && SKA.logFrom !== 'log') { var f = SKA.logFrom; SKA.logFrom = ''; if (f === 'school') { SKA.view = 'school'; render(); window.scrollTo(0, 0); } else go(f); return; }
      if (SKA.view !== 'home' && SKA.data) { go('home'); return; }
      app.exitApp();
    });
  }
})();
(function start() {
  SKA.token = store('skx_token') || ''; SKA.name = store('skx_name') || '';
  store('skx_open', null); // folded sections of app 1.1.0
  setUpdate(store('skx_update') === '1');
  if (store('skx_who')) $('lgWho').value = store('skx_who');
  if (!SKA.token) { showLogin(''); return; }
  try { SKA.data = JSON.parse(store('skx_home') || 'null'); } catch (e) { SKA.data = null; }
  if (SKA.data) { $('vApp').classList.remove('hide'); render(); }
  loadHome(!SKA.data);
})();
</script>
</body>
</html>
