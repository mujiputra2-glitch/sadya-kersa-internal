    return '<button class="prow" onclick="teamHistory(\'' + jsq(r.name) + '\')"><span class="av">' + esc(r.name.charAt(0).toUpperCase()) + '</span><span class="t"><b>' + esc(r.name) + '</b><span>' +
      (r.visits7 || 0) + ' kegiatan 7 hari · ' + (r.newTargets ? r.newStarted + ' dari ' + r.newTargets + ' target dimulai' : r.schools + ' sekolah') +
      (r.overdue ? ' · ' + esc(nbRp(rp(r.overdue))) + ' lewat tempo' : '') + '</span></span><span class="r">' + esc(nbRp(rp(r.history ? r.history.ytd : r.omzetYear))) + '<span>order ' + Y + '</span></span></button>';
  }).join('') + restRow(d, sales) + '</div>';
}
// The rows add up to the year card: the rest (Kantor, schools without sales, other holders) in one row.
function restRow(d, sales) {
  var y = function (r) { return r.history ? r.history.ytd : r.omzetYear; }, Y = d.today.slice(0, 4);
  var restY = ytdOf(d) - sales.reduce(function (s, r) { return s + (y(r) || 0); }, 0), restOd = (d.totals.overdue || 0) - sales.reduce(function (s, r) { return s + (r.overdue || 0); }, 0);
  if (!(restY > 0) && !(restOd > 0)) return '';
  return '<button class="prow" onclick="go(\'tim\')"><span class="av" style="background:var(--grey)">+</span><span class="t"><b>Kantor dan lainnya</b><span>' +
    (restOd > 0 ? esc(nbRp(rp(restOd))) + ' lewat tempo' : 'Kantor dan sekolah tanpa sales') + '</span></span><span class="r">' + esc(nbRp(rp(restY))) + '<span>order ' + Y + '</span></span></button>';
}
// This year by month (bars, the current month amber) over last year (grey).
function trendCard(d) {
  var hs = d.history; if (!hs || !hs.months) return '';
  var Y = +d.today.slice(0, 4), mo = +d.today.slice(5, 7) - 1, m = hs.months, p = hs.monthsPrev || [], max = 1, i, h = '';
  for (i = 0; i < 12; i++) max = Math.max(max, m[i] || 0, p[i] || 0);
  var ht = function (v) { return v > 0 ? Math.max(3, Math.round(v / max * 100)) : 0; };
  for (i = 0; i < 12; i++) h += '<div class="c' + (i === mo ? ' now' : i > mo ? ' later' : '') + '">' + (p[i] > 0 ? '<s style="height:' + ht(p[i]) + '%"></s>' : '') +
    '<i style="height:' + (i > mo ? 0 : ht(m[i])) + '%"></i></div>';
  return '<div class="caption">Omzet per bulan</div><div class="float rise" style="--i:3"><div class="trend">' + h + '</div><div class="trendl">' +
    SKA_BULAN.map(function (b) { return '<span>' + b + '</span>'; }).join('') + '</div>' +
    '<div class="legend"><span><i class="key b"></i>' + Y + '</span><span><i class="key g"></i>' + (Y - 1) + '</span></div>' +
    '<button class="link" onclick="go(\'order\')">Lihat angka per bulan' + SKA_ICON.right + '</button></div>';
}

// ---------- category screens ----------
function catTop(title, sub) {

}
function vCat(d, v) {

function followBody(d) {

function tagihanBody(d) {

// BOS banner from settings.seasonInfo ({active} or a countdown {days}); older servers: settings.season.
function bosBanner(st) {
  var si = st.seasonInfo;
  if (!si) return st.season ? '<div class="note amber"><b>Musim BOS.</b> Dana BOS segera cair: datangi sekolah prioritas lebih dulu.</div>' : '';
  if (si.active) return '<div class="note amber"><b>Musim BOS:</b> dana sekolah sedang cair.</div>';

}
var SKA_EMPTY = 'Belum ada sekolah pegangan untuk akun ini. Minta Mas Firman mengisi nama Anda di kolom Sales pada Sales Tracker, atau tambah sekolah prospek lewat Sekolah > + Baru.';
// The server's 5 recommendations as cards, then due follow-ups that did not make the 5. The Manajer
// picks Tim (the 5 most pressing of all schools) or one sales (that person's own 5, from 'team').
// noTitle: on the tasks screen, whose top bar carries the title and the line about the choice.
function vRecommend(d, noTitle) {
  var h = noTitle ? '' : '<h2>Rekomendasi minggu ini</h2>', shown = {}, pick = null;
  if (!d.schools.length) return h + '<div class="note amber">' + SKA_EMPTY + '</div>';
  var rows = isMgr(d) && d.team ? d.team.filter(function (r) { return r.sales && r.recommend; }) : [];
  rows.forEach(function (r) { if (r.name === SKA.recSales) pick = r; });
  var list = pick ? pick.recommend : d.recommend;
  if (!noTitle && (list.length || rows.length)) h += '<p class="muted small" style="margin:-6px 0 0">Dipilih otomatis dari order, tagihan dan kegiatan.</p>';
  if (rows.length) h += '<div class="seg">' + [''].concat(rows.map(function (r) { return r.name; })).map(function (n) {
    return '<button class="chip' + ((pick ? pick.name : '') === n ? ' on' : '') + '" onclick="SKA.recSales=\'' + jsq(n) + '\';render()">' + esc(n || 'Tim') + '</button>';
  }).join('') + '</div>';
  if (!list.length) h += '<p class="muted">' + (pick && !pick.schools ? 'Belum ada sekolah pegangan ' + esc(pick.name) + '.' : 'Semua sekolah' + (pick ? ' ' + esc(pick.name) : '') + ' sudah dihubungi minggu ini.') + '</p>';
  list.forEach(function (r) { shown[r.key] = true; h += recCard(d, r); });
  var mine = function (x) { var s = school(x.key); return !pick || (!!s && sameName(s.sales, pick.name)); };
  var fu = d.follow || { due: [], soon: [] }, more = (fu.due || []).filter(function (x) { return !shown[x.key] && mine(x); });
  if (more.length) h += '<div class="sub3">Tindak lanjut lainnya</div>' + more.map(function (x) { return followItem(d, x); }).join('');
  return h + soonLine({ soon: (fu.soon || []).filter(mine) });
}
// On the tasks screen each recommendation is one row (school, why in a few words); a tap opens its
// reasons and buttons (one open at a time). Beranda's focus card shows the first one open.
function recCard(d, r) {
  var s = school(r.key) || { key: r.key, name: r.name, color: 'red' }, kinds = (d.lists && d.lists.kinds) || {}, open = SKA.recOpen === r.key;
  var line = [kinds[r.kind] || '', s.color === 'grey' ? 'Belum mulai' : ''].filter(String).join(' · ');
  return '<div class="card rec' + (open ? ' open' : '') + '"><button class="recrow" aria-expanded="' + open + '" onclick="toggleRec(\'' + jsq(r.key) + '\')">' +
    '<span class="dot ' + esc(s.color) + '"></span><span class="t"><b>' + esc(r.name) + '</b>' + (line ? '<span>' + esc(line) + '</span>' : '') + '</span>' +
    (isMgr(d) ? '<span class="who">' + esc(salesLabel(r.sales)) + '</span>' : '') + SKA_ICON.down + '</button>' +
    (open ? recBody(d, r, s, true) + '<button class="link" onclick="go(\'school\',\'' + jsq(r.key) + '\')">Buka detail sekolah' + SKA_ICON.right + '</button>' : '') + '</div>';
}
function toggleRec(key) { SKA.recOpen = SKA.recOpen === key ? '' : key; render(); }
function recInner(d, r) {

  return '<button class="head" onclick="go(\'school\',\'' + jsq(r.key) + '\')"><span class="dot ' + esc(s.color) + '"></span><b>' + esc(r.name) + '</b>' +

}
// Tags (why, and Belum mulai; noTags: the row above already says them), every reason, the buttons the server chose.
function recBody(d, r, s, noTags) {
  var kinds = (d.lists && d.lists.kinds) || {};

    (s.color === 'grey' ? '<i class="tag grey">Belum mulai</i>' : '');

// Buttons of a recommendation (server 'actions'): catat, telepon, wa, tagih, pic.
function actBtn(a, s) {

}
function followItem(d, x) {

    '<span><b style="color:var(--red)">' + (x.late ? 'lewat ' + x.late + ' hari' : 'hari ini') + '</b> · terakhir: ' + esc(x.hasil) + (isMgr(d) ? ' · ' + esc(x.sales) : '') + '</span></span></button>';
}
function soonLine(fu) {

// Older servers (no 'recommend'): follow-ups due and "Prioritas minggu ini" as app 1.0.0 shows them.
function vPriority(d) {
  var fu = d.follow || { due: [], soon: [] }, h = '';

// x: {key, school, sales, inv, date, age, amount, picName, picPhone}. one = the sheet of one school (no name row).
function tagihItem(d, x, one) {

}
function openSchool(key) { closeSheet(); go('school', key); }
// Reminder text from Pengaturan "Pesan WA tagihan": {waktu} {pic} {sales} {invoice} {tanggal} {jumlah} ({sekolah} too).
function waTagihText(x) {
  var d = SKA.data, tpl = d.settings.waTagih || '', pic = x.picName || '';

  return fill(tpl, { waktu: waktu(), pic: pic, sales: d.me.name, sekolah: x.school || '', invoice: x.inv || '', tanggal: tglPanjang(x.date), jumlah: rpPenuh(x.amount) })
    .replace(/Bapak\/Ibu\s+,/g, 'Bapak/Ibu,').replace(/ {2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();

function waTagihHref(x) { var p = phoneOk(x.picPhone); return 'https://wa.me/' + (p ? '62' + p.slice(1) : '') + '?text=' + encodeURIComponent(waTagihText(x)); }
// Overdue invoices of one school (button Tagih of a recommendation).
function tagihSheet(key) {
  var d = SKA.data, s = school(key) || { key: key, name: '' }, days = d.settings.overdueDays || 25;

  });

}

// Order (the bottom bar's Riwayat is the activity list): this year to date next to the same days
// last year, order per month (bar = this year, thin yellow line = the same month last year, with
// last year's amounts in a line below), activities per month and totals per year.
// hs: the totals to show, by default the viewer's own (d.history); the Manajer's Tim rows pass one
// person's. The monthly target bar belongs to the viewer's own numbers only.
function historyBody(d, hs) {
  var own = !hs || hs === d.history, t = d.totals, Y = +d.today.slice(0, 4), mo = +d.today.slice(5, 7) - 1, h = '';
  hs = hs || d.history;
  h += '<dl class="kv" style="margin-top:12px"><dt>Order ' + Y + ' sampai hari ini</dt><dd>' + rp(hs.ytd) + '</dd>' +
    '<dt>Order ' + (Y - 1) + ' periode yang sama</dt><dd>' + rp(hs.ytdPrev) + '</dd></dl>';
  if (own && t.target > 0) {
    var pct = Math.min(100, Math.round(t.omzetMonth / t.target * 100));
    h += '<div class="lbl">Target bulan ini ' + rp(t.target) + ': ' + pct + '%</div><div class="mtrack"><i class="b" style="width:' + pct + '%"></i></div>';
  }
  var months = hs.months || [], prev = hs.monthsPrev || [], max = 1, last = [], i;
  for (i = 0; i < 12; i++) { max = Math.max(max, months[i] || 0, prev[i] || 0); if (prev[i] > 0) last.push(SKA_BULAN[i] + ' ' + rp(prev[i])); }
  h += '<div class="lbl">Order per bulan</div><div class="mchart">';
  for (i = 0; i < 12; i++) h += barRow(SKA_BULAN[i], months[i] || 0, prev[i] || 0, max, i === mo ? ' now' : i > mo ? ' later' : '');
  h += '</div><div class="legend"><span><i class="key b"></i>' + Y + '</span><span><i class="key p"></i>bulan yang sama ' + (Y - 1) + '</span></div>';
  if (last.length) h += '<div class="small" style="margin-top:8px">Order ' + (Y - 1) + ' per bulan: ' + esc(nbRp(last.join(', '))) + '.</div>';
  // Activities from the first month that has one (the months before the app have none).
  var v = hs.visitsByMonth || [], st = 0;
  while (st < mo && !(v[st] > 0)) st++;
  h += '<div class="lbl">Kegiatan per bulan ' + Y + '</div><div class="vgrid">';
  for (i = st; i <= mo; i++) h += '<div>' + SKA_BULAN[i] + '<b>' + (v[i] || 0) + '</b></div>';
  h += '</div>' + yearBars(hs.byYear, String(Y));
  return h + '<p class="muted small" style="margin-top:10px">Dari order yang dicatat admin.</p>';
}
function barRow(label, v, p, max, cls) {
  return '<div class="mrow' + (cls || '') + '"><span class="ml">' + esc(label) + '</span><span class="mtrack"><i class="b" style="width:' + Math.round(v / max * 100) + '%"></i>' +
    (p > 0 ? '<i class="p" style="left:' + Math.round(p / max * 100) + '%"></i>' : '') + '</span><span class="mv">' + (v ? rp(v) : '-') + '</span></div>';
}
function yearBars(byYear, Y) {
  var years = Object.keys(byYear || {}).sort(), max = 1;
  years.forEach(function (y) { max = Math.max(max, byYear[y] || 0); });
  return years.length ? '<div class="lbl">Order per tahun</div><div class="mchart">' + years.map(function (y) { return barRow(y, byYear[y] || 0, 0, max, y === Y ? ' now' : ''); }).join('') + '</div>' : '';
}

// Detail tim (Manajer only): one row per sales, then Kantor and other holders. A row: money,
// activities of the last 7 days, follow-ups, how many new targets (schools that are no client yet)

        '<span><b>' + rp(r.history ? r.history.ytd : r.omzetYear) + '</b>order ' + Y + ' s.d. hari ini</span><span><b>' + rp(r.omzet12) + '</b>12 bulan terakhir</span>' +
        '<span><b>' + r.visits7 + '</b>kegiatan 7 hari terakhir</span><span><b>' + r.followDue + '</b>tindak lanjut jatuh tempo</span>' +
        '<span><b>' + (r.newTargets ? r.newStarted + ' dari ' + r.newTargets : '-') + '</b>target baru dimulai</span><span><b>' + rp(r.overdue) + '</b>tagihan lewat tempo</span></span>' +
        '<div class="btnrow"><button class="btn" onclick="teamFilter(\'' + jsq(r.name) + '\')">Lihat sekolah</button>' +
        (r.history ? '<button class="btn" onclick="teamHistory(\'' + jsq(r.name) + '\')">Lihat riwayat</button>' : '') + '</div></div>';
  }).join('');

// One person's order history (the same numbers that person sees in "Order saya"), in a sheet.
function teamHistory(name) {
  var d = SKA.data, r = (d.team || []).filter(function (x) { return x.name === name; })[0];

// ---------- KPI and incentive (app 1.4.0, server Kpi.js; own tab since 1.5.0) ----------

var SKA_KST = { naik: ['g', 'Siap naik level'], aman: ['g', 'Aman'], turun: ['r', 'Zona turun level'], baru: ['', 'Belum ada bulan penuh'] };
// 'yyyy-MM-dd HH:mm' from the server as 5 Nov, 09:47.
function stampTxt(s) { return s ? tgl(String(s).slice(0, 10)) + (String(s).length > 10 ? ', ' + String(s).slice(11, 16) : '') : ''; }

// A checklist line: ok = fine, mid = not at the line to go up yet, no = in the zone or short.

function kmet(cls, icon, label, val, sub) {
  return '<div class="kmet ' + cls + '"><i class="mi">' + SKA_ICON[icon] + '</i><span><b>' + esc(label) + '</b><em>' + esc(sub) + '</em></span><strong>' + esc(val) + '</strong></div>';

function kmark(cls, html) { return '<div><i class="' + cls + '">' + (cls === 'ok' ? '&#10003;' : cls === 'no' ? '!' : '&#9675;') + '</i><span>' + html + '</span></div>'; }

}
// The verdict in one sentence, then each indicator against its lines.
function kpStatus(k) {

  if (k.status === 'naik') head = 'Ketiga syarat naik ke ' + k.next + ' terpenuhi. Keputusan naik level tetap dari Mas Firman.';
  else if (k.status === 'turun') head = (k.prev ? 'Bisa turun ke ' + k.prev : 'Masa probation bisa tidak lulus') + ' bila angka di bawah tidak membaik. Perkiraan dan langkahnya ada di bawah.';
  else if (k.status === 'baru') head = 'Belum ada bulan penuh di level ini, jadi belum ada penilaian. Perkiraan bulan ini ada di bawah.';

      (s.other ? '<dt>Bukti lain</dt><dd>' + esc(s.other) + '</dd>' : '') + (s.status === 'Diterima' ? '<dt>Diterima</dt><dd>' + esc(stampTxt(s.got)) + '<br><span class="muted small">' + esc(s.gotBy) + '</span></dd>' : '') + '</dl>' +
      (s.checks && s.checks.some(function (c) { return !c.ok; }) ? '<div class="note amber"><b>Selisih dari sekolah:</b> ' + s.checks.map(function (c, i) {
        return c.ok ? '' : esc((s.lines[i] || {}).item) + ': ' + esc(c.ket.toLowerCase()) + ' ' + esc(c.diff);
      }).filter(String).join('; ') + '</div>' : '') +
      (s.schoolNote ? '<div class="note"><b>Catatan sekolah:</b> ' + esc(s.schoolNote) + '</div>' : '') +
      (s.photo ? sjPhotoBox(s.no) : '') + (s.status === 'Dikirim' ? '<p class="muted small" style="margin:10px 0 0">Menunggu sekolah mengonfirmasi barang diterima di aplikasi SNAPP.</p>' : '') + '</div>' +
      (s.status === 'Dikirim' ? '<button class="btn block" style="margin-top:10px" onclick="cancelSj()">Batalkan surat jalan</button>' : '');
  } else h += '<div class="note" style="margin-top:12px">Surat jalan ini dibatalkan. ' + esc(s.note) + '</div>';
  return h;
}
function sjPhotoBox(no) {
  var p = (SKA.sjPhotos || {})[no];
  if (!p) return '<button class="btn block" style="margin-top:10px" onclick="loadSjPhoto(\'' + jsq(no) + '\')">' + SKA_ICON.cam + 'Lihat foto bukti kirim</button>';
  return p.err ? '<div class="note amber">' + esc(p.err) + '</div>' : '<img class="sjphoto" src="' + esc(p.url) + '" alt="Foto bukti kirim">';
}
function loadSjPhoto(no) {
  busy(true, 'Memuat foto...');
  call('skxSjPhoto', SKA.token, no).then(function (url) { busy(false); SKA.sjPhotos = SKA.sjPhotos || {}; SKA.sjPhotos[no] = { url: url }; render(); })
    .catch(function (e) { busy(false); SKA.sjPhotos = SKA.sjPhotos || {}; SKA.sjPhotos[no] = { err: e.message }; render(); });
}
function shipState() { if (!SKA.ship || SKA.ship.no !== SKA.key) SKA.ship = { no: SKA.key, photo: '', other: '' }; return SKA.ship; }
function shipPhoto() { takePhoto(function (url) { shipState().photo = url; render(); }); }
function shipSj() {
  var st = shipState(), no = st.no;
  busy(true, st.photo ? 'Mengunggah foto...' : 'Menyimpan...');
  call('skxSjShip', SKA.token, no, st.photo, st.other).then(function () {
    busy(false); SKA.ship = null; toast('Surat jalan ' + no + ' ditandai dikirim. Sekolah bisa mengonfirmasi di aplikasinya.');
    custRefresh(SKA.custKey);
  }).catch(function (e) { busy(false); var el = $('shErr'); if (el) { el.textContent = e.message; el.classList.remove('hide'); } else toast(e.message); });
}
function cancelSj() {
  var reason = prompt('Alasan membatalkan surat jalan ' + SKA.key + '?');
  if (reason === null) return;
  busy(true, 'Menyimpan...');
  call('skxSjCancel', SKA.token, SKA.key, reason).then(function () { busy(false); toast('Surat jalan dibatalkan.'); custRefresh(SKA.custKey); })
    .catch(function (e) { busy(false); toast(e.message); });
}
// What the customer side asks of the Admin today, on Beranda.
function custCard(d) {
  var c = (d.admin || {}).customers;
  if (!c || c.error) return '';
  var rows = [], attn = function (fl, cls, icon, html) {
    return '<button class="attn" onclick="SKA.custFilter=\'' + fl + '\';go(\'acust\')"><span class="ai' + (cls ? ' ' + cls : '') + '">' + SKA_ICON[icon] + '</span><span class="t">' + html + '</span>' + SKA_ICON.right + '</button>';
  };
  if (c.disputes) rows.push(attn('act', '', 'alert', '<b>' + c.disputes + ' invoice ditandai tidak sesuai</b> oleh sekolah.'));
  if (c.toShip) rows.push(attn('act', 'a', 'box', '<b>' + c.toShip + ' invoice</b> ' + SKA_RECENT + ' hari terakhir belum punya surat jalan.'));
  if (c.sjOpen) rows.push(attn('act', 'a', 'box', '<b>' + c.sjOpen + ' surat jalan</b> belum ditandai dikirim.'));
  if (c.sjSent) rows.push(attn('act', 'g', 'clock', '<b>' + c.sjSent + ' kiriman</b> menunggu konfirmasi sekolah.'));
  return rows.length ? '<div class="caption">Pelanggan</div><div class="float rise" style="--i:1">' + rows.join('') + '</div>' : '';
}
var SKA_RECENT = 60;

// Bottom bar per role: the sales screens, or the admin's four.
var SKA_NAV = {
  sales: '<button data-nav="home">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>' +
    '<button data-nav="schools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-5h6v5"/></svg>Sekolah</button>' +
    '<button data-nav="log" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Catat</button>' +
    '<button data-nav="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>' +
    '<button data-nav="kp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.6 13.8L7 22l5-3 5 3-1.6-8.2"/></svg>KPI</button>',
  admin: '<button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>' +
    '<button data-nav="aorder" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Order</button>' +
    '<button data-nav="ainvoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Tagihan</button>' +
    '<button data-nav="acust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Pelanggan</button>'
};
// Sales and Manajer share the bar; the Manajer's KPI tab opens the team (kpteam), a sales' her own (kp).
function setNav(d) {
  var role = isAdmin(d) ? 'admin' : isMgr(d) ? 'mgr' : 'sales', el = $('navIn');
  if (el && el.getAttribute('data-role') !== role) {
    el.innerHTML = role === 'mgr' ? SKA_NAV.sales.replace('data-nav="kp"', 'data-nav="kpteam"') : SKA_NAV[role];
    el.setAttribute('data-role', role); el.classList.remove('three'); el.classList.toggle('five', role !== 'admin');
  }
}

// ---------- sheets: new school, contact ----------
function openSheet(html) { $('sheetPanel').innerHTML = html; $('sheet').classList.remove('hide'); }
function closeSheet() { $('sheet').classList.add('hide'); }
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
// A Manajer's new school has no sales yet (skxAddSchool leaves Sales empty for him).
function addSchoolSheet(fromLog) {
  openSheet('<h2>Sekolah baru</h2><p class="muted small" style="margin-top:-4px">Sekolah prospek yang belum ada di daftar. ' +
    (isMgr(SKA.data) ? 'Masuk daftar sebagai Belum ada sales. Isi nama sales di Sales Tracker, kolom Sales.' : 'Langsung menjadi pegangan Anda.') + '</p>' +
    '<div class="field"><label for="nsName">Nama sekolah</label><input id="nsName" type="text" placeholder="Contoh: SMPN 2 Cimahi" value="' + esc(fromLog && SKA.form ? SKA.form.q : '') + '"></div>' +
    '<div class="field"><label for="nsType">Jenjang</label><select id="nsType"><option value="">Pilih</option>' + ['TK / KB / PAUD', 'SD', 'SMP', 'SMA', 'SMK', 'PKBM', 'SLB', 'Lainnya'].map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label for="nsStud">Jumlah siswa <span class="muted small">(boleh kosong)</span></label><input id="nsStud" type="text" inputmode="numeric" placeholder="Contoh: 640"></div>' +
    '<div class="field"><label for="nsArea">Wilayah</label><select id="nsArea"><option value="">Pilih</option>' + areaOptions() + '</select></div>' +
    '<div class="field"><label for="nsPic">PIC / Kepsek <span class="muted small">(boleh kosong)</span></label><input id="nsPic" type="text"></div>' +
    '<div class="field"><label for="nsPhone">No HP PIC <span class="muted small">(boleh kosong)</span></label><input id="nsPhone" type="tel" inputmode="tel"></div>' +
    '<div id="nsErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn teal" onclick="saveSchool(' + (fromLog ? 'true' : 'false') + ')">Simpan</button></div>');
}
// Wilayah as a list (3 Nov, Firman): the four codes of his school list (value) with the app's names,
// so Kabar wilayah and the area counts read every new school.
function areaOptions() {
  var a = (SKA.data && SKA.data.lists && SKA.data.lists.areas) || { Bandung: 'Kota Bandung', Cimahi: 'Kota Cimahi', Kab: 'Kab. Bandung', KBB: 'Bandung Barat' };
  return Object.keys(a).map(function (c) { return '<option value="' + esc(c) + '">' + esc(a[c] + (c === 'KBB' ? ' (KBB)' : '')) + '</option>'; }).join('') +
    '<option value="Lainnya">Lainnya</option>';
}
function saveSchool(fromLog) {
  var s = { name: $('nsName').value, type: $('nsType').value, area: $('nsArea').value, pic: $('nsPic').value, picPhone: $('nsPhone').value, students: $('nsStud').value };
  busy(true, 'Menyimpan...');
  call('skxAddSchool', SKA.token, s).then(function (r) {
    closeSheet(); toast(r.existed ? 'Sekolah sudah ada di daftar Anda.' : 'Sekolah ditambahkan.');
    return call('skxHome', SKA.token).then(function (d) {
      SKA.data = d; store('skx_home', JSON.stringify(d)); busy(false);
      if (fromLog && SKA.form) { SKA.form.key = r.key; SKA.form.pick = false; SKA.view = 'log'; } else { SKA.from = 'schools'; SKA.view = 'school'; SKA.key = r.key; }
      render();
    });
  }).catch(function (e) { busy(false); var el = $('nsErr'); if (el) { el.textContent = e.message; el.classList.remove('hide'); } else toast(e.message); });
}
// Contact sheet of a school (default: the open school). ask = right after a visit was saved for a
// school without a PIC number ('queued': a visit saved offline that has just been sent). thenTagih
// = opened from a reminder without a number: after Simpan the school's reminders open again.
function contactSheet(key, ask, thenTagih) {
  var s = school(key || SKA.key); if (!s) return;
  SKA.contactKey = s.key; SKA.contactThen = !!thenTagih;
  openSheet((ask ? '<p class="ok" style="margin:0 0 8px">' + (ask === 'queued' ? 'Catatan tertunda sudah terkirim.' : 'Kegiatan tersimpan. Terima kasih!') + '</p>' : '') +
    '<h2>' + (ask ? 'Sudah dapat nama dan nomor PIC?' : 'Kontak ' + esc(s.name)) + '</h2>' +
    (ask ? '<p class="muted small" style="margin-top:-4px">' + esc(s.name) + '. Dengan nomor PIC, Anda bisa telepon dan WhatsApp dari aplikasi.</p>' : '') +
    '<div class="field"><label for="cPic">PIC / Kepsek</label><input id="cPic" type="text" value="' + esc(s.pic) + '"></div>' +
    '<div class="field"><label for="cPhone">No HP PIC</label><input id="cPhone" type="tel" inputmode="tel" value="' + esc(s.picPhone) + '" placeholder="0812 3456 7890"></div>' +
    '<div id="cErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">' + (ask ? 'Nanti saja' : 'Batal') + '</button><button class="btn teal" onclick="saveContact()">Simpan</button></div>');
}
function saveContact() {
  var key = SKA.contactKey, then = SKA.contactThen; if (!school(key)) { closeSheet(); return; }
  busy(true, 'Menyimpan...');
  call('skxContact', SKA.token, key, $('cPic').value, $('cPhone').value).then(function (r) {
    var s = school(key); // looked up again: a reload may have replaced the data meanwhile
    busy(false); if (s) { s.pic = r.pic; s.picPhone = r.picPhone; }
    // The reminders carry their own copy of the PIC.
    (SKA.data.tagihan || []).forEach(function (x) { if (x.key === key) { x.picName = r.pic; x.picPhone = r.picPhone; } });
    store('skx_home', JSON.stringify(SKA.data)); closeSheet(); render(); toast('Kontak disimpan.');
    if (then) tagihSheet(key); // back to the reminder she wanted to send
    loadHome(false); // recommendation buttons and reminders now have the number
  }).catch(function (e) { busy(false); var el = $('cErr'); if (el) { el.textContent = e.message; el.classList.remove('hide'); } else toast(e.message); });
}

// Jumlah siswa of the open school (5 Nov): Estimasi BOS 2027 follows from the level (SKS.bos on the server).
function studentsSheet() {
  var s = school(SKA.key); if (!s) return;
  openSheet('<h2>Jumlah siswa</h2><p class="muted small" style="margin-top:-4px">' + esc(s.name) + (s.type ? ' (' + esc(s.type) + ')' : '') + '. Dipakai untuk menghitung Estimasi BOS 2027.</p>' +
    '<div class="field"><label for="stN">Jumlah siswa</label><input id="stN" type="text" inputmode="numeric" placeholder="Contoh: 640" value="' + esc(s.students || '') + '"></div>' +
    '<div id="stErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn teal" onclick="saveStudents()">Simpan</button></div>');
}
function saveStudents() {
  var key = SKA.key;
  busy(true, 'Menyimpan...');
  call('skxStudents', SKA.token, key, $('stN').value).then(function (r) {
    var s = school(key);
    busy(false); if (s) { s.students = r.students; if (r.bos) s.bos = r.bos; }
    store('skx_home', JSON.stringify(SKA.data)); closeSheet(); render(); toast('Jumlah siswa disimpan.');
    loadHome(false);
  }).catch(function (e) { busy(false); var el = $('stErr'); if (el) { el.textContent = e.message; el.classList.remove('hide'); } else toast(e.message); });
}

// ---------- start ----------
// One listener on the bar: its buttons are rebuilt per role (setNav).
document.querySelector('.nav').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button[data-nav]') : null;
  if (b) { var v = b.getAttribute('data-nav'); go(v, v === 'log' ? '' : undefined); }
});
$('lgBtn').addEventListener('click', doLogin);
$('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
(function nativeSetup() {
  if (window.SKX_API) {
    var v = document.createElement('p');
    v.className = 'muted small';
    v.textContent = 'Versi ' + window.SKX_API.version + ' ';
    if (/^https:\/\//.test(window.SKX_API.privacy || '')) {
      var pl = document.createElement('a');
      pl.href = window.SKX_API.privacy; pl.target = '_blank'; pl.rel = 'noopener'; pl.textContent = 'Kebijakan privasi';
      v.appendChild(document.createTextNode(String.fromCharCode(183) + ' ')); v.appendChild(pl);
    }
    $('vLogin').appendChild(v);
  }
  var launcher = nativePlugin('AppLauncher'), app = nativePlugin('App');
  if (launcher) {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.classList.contains('off')) return;
      var href = a.getAttribute('href');
      if (!/^(tel:|https?:)/.test(href)) return;
      e.preventDefault();
      launcher.openUrl({ url: href }).catch(function () { toast('Tautan tidak bisa dibuka di HP ini.'); });
    });
  }
  if (app) {
    app.addListener('resume', function () { flushQueue(); }); // back from the background: send what waits
    app.addListener('backButton', function () {
      if (!$('sheet').classList.contains('hide')) { closeSheet(); return; }
      if (SKA.view === 'school') { goBack(); return; }
      if (SKA.view === 'ainvoice') { go('ainvoices'); return; }
      if (SKA.view === 'kp' && isMgr(SKA.data)) { go('kpteam'); return; }
      if (SKA.view === 'acustd') { go('acust'); return; }
      if (SKA.view === 'asj' || SKA.view === 'asjnew') { go('acustd', SKA.custKey); return; }
      if (SKA.view === 'log' && SKA.logFrom && SKA.logFrom !== 'log') { var f = SKA.logFrom; SKA.logFrom = ''; if (f === 'school') { SKA.view = 'school'; render(); window.scrollTo(0, 0); } else go(f); return; }
      if (SKA.view !== 'home' && SKA.data) { go('home'); return; }
      app.exitApp();
    });
  }
})();
(function start() {
  SKA.token = store('skx_token') || ''; SKA.name = store('skx_name') || '';
  store('skx_open', null); // folded sections of app 1.1.0
  setUpdate(store('skx_update') === '1');
  if (store('skx_who')) $('lgWho').value = store('skx_who');
  if (!SKA.token) { showLogin(''); return; }
  try { SKA.data = JSON.parse(store('skx_home') || 'null'); } catch (e) { SKA.data = null; }
  if (SKA.data) { $('vApp').classList.remove('hide'); render(); }
  loadHome(!SKA.data);
})();
</script>
</body>
